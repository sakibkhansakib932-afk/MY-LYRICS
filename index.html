<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRICS Touch To Copy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #4a154b;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .lyric-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .lyric-card:hover {
            background: #f0f0f0;
        }
        .lyric-text {
            font-size: 0.95rem;
            color: #333;
            word-break: break-word;
        }
        .copy-btn {
            background: #6b21a8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>কাজল কালো দুটি চোখে</h2>
    <div id="lyrics-list"></div>
</div>

<script>
    const lines = [
        "➺❥⃟1কাজল কালো দুটি চোখে⸙❥︎𝄟≛⃝🥰",
        "➺❥⃟2সে যখনই আমায় দেখে⸙❥︎𝄟≛⃝🎀",
        "➺❥⃟3পড়েনা চোখেতে পলক⸙❥︎𝄟≛⃝💓",
        "➺❥⃟4আর আসেনা কথা মুখে⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟5কাজল কালো দুটি চোখে⸙❥︎𝄟≛⃝🥰",
        "➺❥⃟6সে যখনই আমায় দেখে⸙❥︎𝄟≛⃝🎀",
        "➺❥⃟7পড়েনা চোখেতে পলক⸙❥︎𝄟≛⃝💓",
        "➺❥⃟8আর আসেনা কথা মুখে⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟9তার চলে যাওয়া⸙❥︎𝄟≛⃝",
        "➺❥⃟10ফিরে একটু চাওয়া⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟11এই বুকেতে⸙❥︎𝄟≛⃝🤍",
        "➺❥⃟12ঝড় তুলে যায়⸙❥︎𝄟≛⃝☺️",
        "➺❥⃟13যার ছবি এই⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟14মন এঁকে যায়⸙❥︎𝄟≛⃝💓",
        "➺❥⃟15যার কথা ভেবে⸙❥︎𝄟≛⃝💝",
        "➺❥⃟16দিন কেটে যায়⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟17সে কি জানে শুধু তাকে⸙❥︎𝄟≛⃝🌷",
        "➺❥⃟18ভালোবাসে আমার হৃদয়⸙❥︎𝄟≛⃝🎀",
        "➺❥⃟19যার ছবি এই ⸙❥︎𝄟≛⃝🥀",
        "➺❥⃟20মন এঁকে যায়⸙❥︎𝄟≛⃝💓"
    ];

    const container = document.getElementById('lyrics-list');

    lines.forEach(text => {
        const div = document.createElement('div');
        div.className = 'lyric-card';
        div.onclick = () => copyText(text);

        div.innerHTML = `
            <span class="lyric-text">${text}</span>
            <button class="copy-btn">কপি</button>
        `;
        container.appendChild(div);
    });

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert('কপি হয়েছে: ' + text);
    }
</script>

</body>
</html>
