<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Touch to Copy Library</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e2e8f0;
            --muted-color: #64748b;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --muted-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 20px 80px 20px; /* নিছে বটম বারের জন্য জায়গা রাখা হয়েছে */
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 4px;
        }

        .header-title p {
            color: var(--muted-color);
            font-size: 14px;
        }

        .theme-toggle {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--primary-color);
        }

        .controls {
            max-width: 600px;
            margin: 0 auto 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary-color);
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .section-view {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-view.active {
            display: block;
        }

        .lyrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .lyric-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .lyric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .lyric-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--muted-color);
            transition: transform 0.2s;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .fav-btn.active {
            color: #e11d48;
        }

        .lyric-preview {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-color);
            white-space: pre-line;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 4px;
        }

        .copy-btn {
            width: 100%;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: var(--primary-hover);
        }

        /* Profile Section Design */
        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            margin: 40px auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .profile-avatar {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .profile-card h2 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .profile-card p {
            color: var(--muted-color);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: var(--muted-color);
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item span.icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #10b981;
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>🎵 Lyrics Touch to Copy</h1>
            <p>এক ক্লিকেই আপনার পছন্দের লিরিক্স কপি করুন</p>
        </div>
        <button class="theme-toggle"
